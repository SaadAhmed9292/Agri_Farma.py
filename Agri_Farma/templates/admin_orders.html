{% extends 'base.html' %}{% block title %}Admin Orders{% endblock %}{% block content %}
<div class='container'><h2>Orders</h2>
<table class='table'><thead><tr><th>ID</th><th>User</th><th>Status</th><th>Total</th></tr></thead><tbody>
{% for o in orders %}<tr><td>{{ o.id }}</td><td>{{ o.user.name }}</td><td>{{ o.status }}</td><td>Rs. {{ o.total }}</td></tr>{% endfor %}
</tbody></table></div>{% endblock %}
