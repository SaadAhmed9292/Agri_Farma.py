{% extends "base.html" %}
{% block title %}Order Confirmation - AgriFarma{% endblock %}
{% block content %}
<div class="container text-center">
  <div class="my-5">
    <i class="fas fa-check-circle text-success" style="font-size:72px;"></i>
    <h2 class="mt-3">Thank you! Your order has been placed.</h2>
    <p>Order ID: <strong>#{{ order.id }}</strong> • Total: <strong>Rs. {{ order.total }}</strong></p>
    <a href="{{ url_for('order_history') }}" class="btn btn-outline-success">View Orders</a>
    <a href="{{ url_for('shop_home') }}" class="btn btn-success ms-2">Continue Shopping</a>
  </div>
</div>
{% endblock %}
