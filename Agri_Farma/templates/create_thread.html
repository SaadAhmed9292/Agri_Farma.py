{% extends "base.html" %}
{% block title %}Create Thread - AgriFarma{% endblock %}
{% block content %}
<div class="container">
  <h2>Create New Thread in {{ category.name }}</h2>
  <form method="post" action="{{ url_for('create_thread', category_id=category.id) }}">
    <div class="mb-3">
      <label class="form-label">Title</label>
      <input type="text" name="title" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Content</label>
      <textarea name="content" rows="6" class="form-control" required></textarea>
    </div>
    <button class="btn btn-success">Create Thread</button>
  </form>
</div>
{% endblock %}
