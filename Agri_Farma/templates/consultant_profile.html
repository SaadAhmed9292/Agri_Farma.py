{% extends 'base.html' %}
{% block title %}Consultant Profile - AgriFarma{% endblock %}
{% block content %}
<div class='container'>
  <div class='card'>
    <div class='card-body'>
      <div class='d-flex align-items-center'>
        <img src='{{ consultant.user.profile.picture or "/static/images/user.png" }}' class='rounded-circle me-3' width='80' height='80'>
        <div>
          <h3 class='mb-0'>{{ consultant.user.name }}</h3>
          <p class='text-muted mb-0'>{{ consultant.expertise }}</p>
        </div>
      </div>
      <hr>
      <h5>About</h5>
      <p>{{ consultant.bio }}</p>
      <h6>Categories</h6>
      <p>{{ consultant.categories }}</p>
    </div>
  </div>
</div>
{% endblock %}
