{% extends 'base.html' %}{% block title %}Admin Users{% endblock %}{% block content %}
<div class='container'>
<h2>Users</h2>
<table class='table'><thead><tr><th>Name</th><th>Email</th><th>Roles</th><th>Status</th></tr></thead><tbody>
{% for u in users %}<tr><td>{{ u.name }}</td><td>{{ u.email }}</td><td>{% for r in u.roles %}{{ r.name }} {% endfor %}</td><td>{{ 'Active' if u.is_active else 'Disabled' }}</td></tr>{% endfor %}
</tbody></table>
</div>{% endblock %}
