{% extends 'base.html' %}
{% block title %}Edit Product - AgriFarma{% endblock %}
{% block content %}
<div class='container'>
  <h2 class='mb-3'>Edit Product</h2>
  <form method='post' action='{{ url_for('edit_product', product_id=product.id) }}'>
    <div class='mb-3'>
      <label class='form-label'>Name</label>
      <input class='form-control' name='name' value='{{ product.name }}' required>
    </div>
    <div class='mb-3'>
      <label class='form-label'>Description</label>
      <textarea class='form-control' rows='4' name='description'>{{ product.description }}</textarea>
    </div>
    <div class='row'>
      <div class='col-md-4 mb-3'>
        <label class='form-label'>Price</label>
        <input type='number' step='0.01' class='form-control' name='price' value='{{ product.price }}' required>
      </div>
      <div class='col-md-8 mb-3'>
        <label class='form-label'>Category</label>
        <select class='form-select' name='category' required>
          {% for c in categories %}
          <option value='{{ c.id }}' {% if c.id==product.category_id %}selected{% endif %}>{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <button class='btn btn-success'>Update Product</button>
  </form>
</div>
{% endblock %}
